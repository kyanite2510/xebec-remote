<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050a1f">
<title>Xebec Control</title>
<style>
  :root{
    --bg:#050a1f; --panel:#141a54; --panel2:#0d332f;
    --accent:#4deac0; --accent-dim:#276b5e; --text:#eafffa; --muted:#7d8ad1;
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;
    padding:clamp(6px,1.6vh,16px);
    padding-top:calc(clamp(6px,1.6vh,16px) + env(safe-area-inset-top,0px));
    padding-bottom:calc(clamp(6px,1.6vh,16px) + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:clamp(6px,1.2vh,14px);
  }

  header{display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  header h1{font-size:clamp(.9rem,2vh,1.3rem); margin:0; letter-spacing:.02em;}
  #status{display:flex; align-items:center; gap:6px; font-size:clamp(.6rem,1.4vh,.85rem); color:var(--muted);}
  #dot{width:9px; height:9px; border-radius:50%; background:#e05555; flex-shrink:0;}
  #dot.on{background:var(--accent); box-shadow:0 0 8px var(--accent);}
  #connectBtn{
    background:var(--accent); color:#032420; border:none; padding:clamp(4px,1vh,8px) clamp(8px,2vw,16px);
    border-radius:8px; font-weight:600; cursor:pointer; font-size:clamp(.65rem,1.5vh,.9rem);
  }
  #connectBtn:active{transform:scale(.97);}

  .grid{display:grid; grid-template-columns:.85fr .85fr 1.5fr; gap:clamp(6px,1.2vw,14px); flex:1; min-height:0;}
  .col{display:flex; flex-direction:column; gap:clamp(6px,1.2vh,14px); min-height:0;}
  .panel{background:var(--panel); border-radius:12px; padding:clamp(6px,1.4vh,16px); min-height:0;}
  .panel h2{margin:0 0 clamp(4px,1vh,12px); font-size:clamp(.55rem,1.3vh,.8rem); color:var(--accent); font-weight:600;}
  .row{display:flex; align-items:center; justify-content:space-between; margin-bottom:clamp(4px,1vh,10px); gap:6px;}
  select{
    background:#fff; color:#111; border:none; border-radius:6px; padding:4px 8px;
    font-weight:600; font-size:clamp(.65rem,1.4vh,.95rem); min-width:0;
  }
  .toggle{position:relative; width:clamp(38px,7vh,52px); height:clamp(20px,4vh,28px); flex-shrink:0;}
  .toggle input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer;}
  .track{position:absolute; inset:0; background:#1e254f; border-radius:20px; transition:.15s;}
  .track::after{content:''; position:absolute; width:72%; aspect-ratio:1; border-radius:50%; background:#c9cdef; top:14%; left:4%; transition:.15s;}
  .toggle input:checked + .track{background:var(--accent-dim);}
  .toggle input:checked + .track::after{left:32%; background:var(--accent);}

  #wheelWrap{display:flex; justify-content:center; align-items:center; position:relative; flex:1; min-height:0;}
  #wheel{border-radius:50%; touch-action:none; cursor:pointer; width:min(100%, 20vh); height:min(100%, 20vh); aspect-ratio:1;}
  #wheelKnob{
    position:absolute; width:12px; height:12px; border-radius:50%;
    border:2px solid #fff; pointer-events:none; transform:translate(-50%,-50%);
  }

  #distanceVal{font-size:clamp(1rem,2.6vh,1.4rem); font-weight:700; color:var(--accent);}

  #hornBtn{
    background:var(--panel2); border:2px solid var(--accent-dim); color:var(--accent);
    border-radius:12px; font-size:clamp(.8rem,1.8vh,1.3rem); font-weight:700;
    text-align:center; user-select:none; cursor:pointer; touch-action:none;
    display:flex; align-items:center; justify-content:center; flex:1; min-height:0;
  }
  #hornBtn.active{background:var(--accent); color:#032420; border-color:var(--accent);}

  #brandBar{
    background:var(--accent); color:#032420; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; padding:clamp(6px,1.2vh,12px);
    font-size:clamp(.9rem,2.2vh,1.5rem); font-weight:800; letter-spacing:.25em;
  }

  #terminal{
    background:#03110f; border-radius:10px; padding:6px 10px;
    overflow-y:auto; font-family:'Consolas',monospace; font-size:clamp(.55rem,1.3vh,.82rem);
    color:var(--accent); flex:1; min-height:0;
  }
  #terminal div{white-space:pre-wrap;}

  #joyWrap{
    background:var(--panel2); border-radius:50%; aspect-ratio:1;
    width:min(100%, 92vh); margin:auto; position:relative; touch-action:none;
    border:3px solid var(--accent-dim);
  }
  #joyKnob{
    position:absolute; width:34%; height:34%; border-radius:50%; background:var(--accent);
    top:50%; left:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 18px rgba(77,234,192,.5);
  }
  .barH{position:absolute; left:14%; right:14%; height:3px; background:#1c4d47; border-radius:2px;}

  #rotateMsg{
    display:none; position:fixed; inset:0; background:var(--bg); color:var(--text);
    z-index:99; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    text-align:center; padding:24px;
  }
  #rotateMsg .icon{font-size:2.4rem;}
  @media (orientation:portrait) and (max-width:600px){
    .grid, header{display:none;}
    #rotateMsg{display:flex;}
  }
</style>
</head>
<body>
<div id="rotateMsg"><div class="icon">&#8635;</div><div>Rotate your phone sideways<br>to use the Xebec remote</div></div>

<header>
  <h1>Xebec Control</h1>
  <div id="status"><span id="dot"></span><span id="statusText">disconnected</span><button id="connectBtn">Connect</button></div>
</header>

<div class="grid">
  <div class="col">
    <div class="panel">
      <div class="row"><h2 style="margin:0">Mood</h2>
        <select id="mood">
          <option>Happy</option><option>Sad</option><option>Angry</option><option>Cool</option><option>Surprised</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:0"><h2 style="margin:0">Headlights</h2>
        <div class="toggle"><input type="checkbox" id="headlight"><span class="track"></span></div>
      </div>
    </div>
    <div class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="row"><h2 style="margin:0">Manual Colour</h2>
        <div class="toggle"><input type="checkbox" id="rgbToggle"><span class="track"></span></div>
      </div>
      <div id="wheelWrap">
        <canvas id="wheel" width="160" height="160"></canvas>
        <div id="wheelKnob"></div>
      </div>
    </div>
    <div class="panel">
      <h2>Distance</h2>
      <div id="distanceVal">0.0</div>
    </div>
  </div>

  <div class="col">
    <div id="hornBtn" style="flex:0.6;">HORN</div>
    <div id="brandBar">XEBEC</div>
    <div class="panel" style="flex:2.2; display:flex; flex-direction:column; min-height:0;">
      <h2>Terminal</h2>
      <div id="terminal"></div>
    </div>
  </div>

  <div class="col">
    <div id="joyWrap">
      <div class="barH" style="top:22%"></div>
      <div class="barH" style="top:38%"></div>
      <div class="barH" style="bottom:22%"></div>
      <div class="barH" style="bottom:38%"></div>
      <div id="joyKnob"></div>
    </div>
  </div>
</div>

<script>
const SERVICE_UUID   = '12345678-1234-5678-1234-56789abcdef0';
const CONTROL_UUID   = '12345678-1234-5678-1234-56789abcdef1';
const DISTANCE_UUID  = '12345678-1234-5678-1234-56789abcdef2';
const TERMINAL_UUID  = '12345678-1234-5678-1234-56789abcdef3';

const state = {x:0,y:0,mood:0,headlight:0,r:0,g:255,b:0,rgbToggle:0,horn:0};
let controlChar=null, distanceChar=null, terminalChar=null, device=null;

const dot=document.getElementById('dot'), statusText=document.getElementById('statusText');
const terminalEl=document.getElementById('terminal');

function appendTerminal(msg){
  const d=document.createElement('div'); d.textContent='> '+msg;
  terminalEl.appendChild(d);
  while(terminalEl.children.length>50) terminalEl.removeChild(terminalEl.firstChild);
  terminalEl.scrollTop=terminalEl.scrollHeight;
}

function setStatus(on){
  dot.classList.toggle('on',on);
  statusText.textContent=on?'connected':'disconnected';
  document.getElementById('connectBtn').textContent=on?'Disconnect':'Connect';
}

function sendControl(){
  if(!controlChar) return;
  const u=new Uint8Array(9);
  u[0]=state.x; u[1]=state.y; u[2]=state.mood; u[3]=state.headlight;
  u[4]=state.r; u[5]=state.g; u[6]=state.b; u[7]=state.rgbToggle; u[8]=state.horn;
  controlChar.writeValueWithoutResponse(u).catch(()=>{});
}

async function onConnectClick(){
  if(document.documentElement.requestFullscreen && !document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
  if(device && device.gatt.connected){ device.gatt.disconnect(); return; }
  try{
    device = await navigator.bluetooth.requestDevice({
      filters:[{name:'Xebec'}], optionalServices:[SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', ()=>{ setStatus(false); controlChar=null; appendTerminal('disconnected'); });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    controlChar = await service.getCharacteristic(CONTROL_UUID);
    distanceChar = await service.getCharacteristic(DISTANCE_UUID);
    terminalChar = await service.getCharacteristic(TERMINAL_UUID);

    await distanceChar.startNotifications();
    distanceChar.addEventListener('characteristicvaluechanged', e=>{
      document.getElementById('distanceVal').textContent = e.target.value.getFloat32(0,true).toFixed(1);
    });
    await terminalChar.startNotifications();
    terminalChar.addEventListener('characteristicvaluechanged', e=>{
      appendTerminal(new TextDecoder().decode(e.target.value));
    });

    setStatus(true);
    appendTerminal('connected to Xebec');
    setInterval(sendControl, 100);
  }catch(err){
    appendTerminal('connect failed: '+err.message);
  }
}
document.getElementById('connectBtn').addEventListener('click', onConnectClick);

// ---- Joystick ----
const joyWrap=document.getElementById('joyWrap'), joyKnob=document.getElementById('joyKnob');
let joyActive=false, joyRect;
function joyMove(clientX, clientY){
  const r=joyRect.width/2, cx=joyRect.left+r, cy=joyRect.top+r;
  let dx=clientX-cx, dy=clientY-cy;
  const dist=Math.min(Math.hypot(dx,dy), r);
  const ang=Math.atan2(dy,dx);
  dx=Math.cos(ang)*dist; dy=Math.sin(ang)*dist;
  joyKnob.style.left=(r+dx)+'px'; joyKnob.style.top=(r+dy)+'px';
  state.x=Math.round((dx/r)*100); state.y=Math.round((-dy/r)*100);
  sendControl();
}
function joyReset(){
  joyKnob.style.left='50%'; joyKnob.style.top='50%'; joyKnob.style.transform='translate(-50%,-50%)';
  state.x=0; state.y=0; sendControl();
}
joyWrap.addEventListener('pointerdown', e=>{
  joyActive=true; joyRect=joyWrap.getBoundingClientRect();
  joyMove(e.clientX,e.clientY); joyWrap.setPointerCapture(e.pointerId);
});
joyWrap.addEventListener('pointermove', e=>{ if(joyActive) joyMove(e.clientX,e.clientY); });
joyWrap.addEventListener('pointerup', ()=>{ joyActive=false; joyReset(); });
joyWrap.addEventListener('pointercancel', ()=>{ joyActive=false; joyReset(); });

// ---- Horn (momentary) ----
const hornBtn=document.getElementById('hornBtn');
hornBtn.addEventListener('pointerdown', ()=>{ state.horn=1; hornBtn.classList.add('active'); sendControl(); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>hornBtn.addEventListener(ev, ()=>{ state.horn=0; hornBtn.classList.remove('active'); sendControl(); }));

// ---- Mood / Headlight ----
document.getElementById('mood').addEventListener('change', e=>{ state.mood=e.target.selectedIndex; sendControl(); });
document.getElementById('headlight').addEventListener('change', e=>{ state.headlight=e.target.checked?1:0; sendControl(); });

// ---- Colour wheel ----
const wheel=document.getElementById('wheel'), wctx=wheel.getContext('2d');
const wheelKnob=document.getElementById('wheelKnob'), wheelWrap=document.getElementById('wheelWrap');
const rgbToggleEl=document.getElementById('rgbToggle');
(function drawWheel(){
  const R=wheel.width/2;
  const img=wctx.createImageData(wheel.width, wheel.height);
  for(let y=0;y<wheel.height;y++){
    for(let x=0;x<wheel.width;x++){
      const dx=x-R, dy=y-R, dist=Math.hypot(dx,dy);
      const idx=(y*wheel.width+x)*4;
      if(dist<=R){
        const hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
        const sat=Math.min(dist/R,1);
        const [r,g,b]=hsv2rgb(hue,sat,1);
        img.data[idx]=r; img.data[idx+1]=g; img.data[idx+2]=b; img.data[idx+3]=255;
      } else img.data[idx+3]=0;
    }
  }
  wctx.putImageData(img,0,0);
})();
function hsv2rgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
// Coordinates use the wheel's rendered (CSS) size, then scale up to the
// canvas's internal 160x160 pixel grid to sample the right color.
function wheelPick(clientX, clientY){
  if(!rgbToggleEl.checked) return;
  const rect=wheel.getBoundingClientRect();
  const relX=clientX-rect.left, relY=clientY-rect.top;
  const R=rect.width/2;
  if(Math.hypot(relX-R, relY-R) > R) return;
  const scaleX=wheel.width/rect.width, scaleY=wheel.height/rect.height;
  const px_x=Math.min(Math.max(Math.round(relX*scaleX),0), wheel.width-1);
  const px_y=Math.min(Math.max(Math.round(relY*scaleY),0), wheel.height-1);
  const px=wctx.getImageData(px_x, px_y, 1, 1).data;
  state.r=px[0]; state.g=px[1]; state.b=px[2];
  wheelKnob.style.left=(rect.left-wheelWrap.getBoundingClientRect().left+relX)+'px';
  wheelKnob.style.top=(rect.top-wheelWrap.getBoundingClientRect().top+relY)+'px';
  sendControl();
}
wheel.addEventListener('pointerdown', e=>{ wheel.setPointerCapture(e.pointerId); wheelPick(e.clientX,e.clientY); });
wheel.addEventListener('pointermove', e=>{ if(e.buttons) wheelPick(e.clientX,e.clientY); });
rgbToggleEl.addEventListener('change', e=>{ state.rgbToggle=e.target.checked?1:0; sendControl(); });

if(!navigator.bluetooth){ appendTerminal('Web Bluetooth not supported in this browser'); }
</script>
</body>
</html>
